{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Our New Arrivals</h1>
    <div class="d-flex gap-2">
        <div class="dropdown">
            <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                Sort by price
            </button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-menu-item p-2 d-block text-decoration-none" href="?sort=price_asc">Low to High</a></li>
                <li><a class="dropdown-menu-item p-2 d-block text-decoration-none" href="?sort=price_desc">High to Low</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-menu-item p-2 d-block text-danger text-decoration-none" href="{% url 'cloth_list' %}">Reset</a></li>
            </ul>
        </div>
        <a href="{% url 'cloth_create' %}" class="btn btn-success">+ Add Item</a>
    </div>
</div>

<div class="row">
    {% for item in items %}
    <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm">
            <div class="card-body">
                <h5 class="card-title">{{ item.title }}</h5>
                <p class="card-text text-muted mb-1">Brand: {{ item.brand.name }}</p>
                <p class="card-text fw-bold">{{ item.price }} uah</p>
                <a href="{% url 'cloth_detail' item.pk %}" class="btn btn-primary">More</a>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12 text-center">
        <p class="text-muted">No items found.</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
