{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-6 text-center">
            <img src="https://via.placeholder.com/400x500" class="img-fluid rounded shadow" alt="Item image">
        </div>
        <div class="col-md-6">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="{% url 'cloth_list' %}">Home</a></li>
                    <li class="breadcrumb-item active">{{ item.brand.name }}</li>
                </ol>
            </nav>
            <h1 class="display-5">{{ item.title }}</h1>
            <p class="text-primary h3 mb-4">{{ item.price }} uah</p>
            
            <div class="card bg-light mb-4">
                <div class="card-body">
                    <p><strong>Color:</strong> {{ item.cloth_color }}</p>
                    <p><strong>Size:</strong> {{ item.size }}</p>
                    <p><strong>Stock:</strong> {{ item.stock_quantity }} items available</p>
                </div>
            </div>

            <div class="d-flex gap-2">
                <a href="{% url 'cloth_update' item.pk %}" class="btn btn-warning">Edit</a>
                <a href="{% url 'cloth_delete' item.pk %}" class="btn btn-danger">Delete</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
